<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Word Fate Academy — Quiz & Academy Design</title>
  </head>
  <body>
    <ul class="bg-squares">
      <li></li>
      <li></li>
      <li></li>
      <li></li>
      <li></li>
      <li></li>
      <li></li>
      <li></li>
      <li></li>
      <li></li>
    </ul>

    <div class="container">
      <figure>
        <img
          src="img/cxc_cover.jpg"
          alt="Meow Gummy Team"
          data-i18n-key="aboutCoverAlt"
          data-i18n-attr="alt"
          style="max-height: 400px; object-fit: cover"
        />
      </figure>

      <h1 data-i18n-key="aboutOriginTitle"></h1>
      <div class="res_content">
        <p data-i18n-key="aboutOriginP1"></p>
        <p data-i18n-key="aboutOriginP2"></p>
        <p data-i18n-key="aboutOriginP3"></p>
      </div>

      <h1 style="margin-top: 40px" data-i18n-key="aboutDesignTitle"></h1>
      <div class="res_content">
        <p data-i18n-key="aboutDesignP1"></p>
        <p data-i18n-key="aboutDesignP2"></p>
        <p data-i18n-key="aboutDesignP3"></p>
        <p data-i18n-key="aboutDesignP4"></p>
        <p data-i18n-key="aboutDesignP5"></p>
        <p data-i18n-key="aboutDesignP6"></p>
        <p data-i18n-key="aboutDesignP7"></p>
      </div>

      <h1 style="margin-top: 40px" data-i18n-key="aboutAcademyTitle"></h1>
      <div class="res_content">
        <p data-i18n-key="aboutAcademyP1"></p>
        <p data-i18n-key="aboutAcademyP2"></p>
        <p data-i18n-key="aboutAcademyP3"></p>
        <p data-i18n-key="aboutAcademyP4"></p>
      </div>

      <h1 style="margin-top: 50px" data-i18n-key="aboutEnrollTitle"></h1>
      <nav class="btn-container">
        <a
          href="https://www.penana.com/story/16766/"
          target="_blank"
          class="res_btn"
          data-i18n-key="aboutEnrollPenana"
          >Enroll via Penana</a
        >
        <a
          href="https://www.kadokado.com.tw/book/1425"
          target="_blank"
          class="res_btn"
          data-i18n-key="aboutEnrollKado"
          >Enroll via KadoKado</a
        >
        <a
          href="https://cxc.today/zh/store/ApatiteBlue/work/20217"
          target="_blank"
          class="res_btn"
          data-i18n-key="aboutEnrollCxc"
          >Enroll via CXC</a
        >
        <a
          href="https://www.facebook.com/TealizeWrite/"
          target="_blank"
          class="res_btn"
          data-i18n-key="aboutEnrollFb"
          >Find the creator on Facebook</a
        >
        <a
          href="https://www.instagram.com/tealize_write/"
          target="_blank"
          class="res_btn"
          data-i18n-key="aboutEnrollIg"
          >Find the creator on Instagram</a
        >
        <a
          href="https://www.plurk.com/Tealize"
          target="_blank"
          class="res_btn"
          data-i18n-key="aboutEnrollPlurk"
          >Find the creator on Plurk</a
        >
        <a
          href="https://tealize-write.github.io/"
          target="_blank"
          class="res_btn"
          data-i18n-key="creatorBase"
        ></a>
        <a
          href="index.html?page=quiz"
          class="res_btn"
          style="
            background: var(--accent-color);
            color: #1c1917;
            font-weight: bold;
            margin-top: 20px;
          "
          data-i18n-key="navQuiz"
          >Quiz</a
        >
      </nav>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/translation.js"></script>
  </body>
</html>
